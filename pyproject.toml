[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-ai-capstone"
version = "0.1.0"
description = "Tenant-isolated RAG, LangGraph research, and AI safety operations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3",
  "SQLAlchemy>=2.0,<3", "numpy>=2,<3", "prometheus-client>=0.20,<1",
  "cryptography>=43,<50",
]
[project.optional-dependencies]
production = ["redis>=5,<8", "psycopg[binary]>=3.2,<4", "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=2,<5", "langgraph-checkpoint-sqlite>=2,<5", "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2", "opentelemetry-instrumentation-fastapi>=0.50b0,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
documents = ["pypdf>=5,<7", "langchain-text-splitters>=0.3,<2"]
llm = ["openai>=1.90,<4"]
# Challenge 1: approved semantic embedding model (downloads weights on first use unless cached).
semantic = ["sentence-transformers>=3,<7"]
# Challenge 15: local PII detection. Runs on this machine; no text is sent to a remote detector.
privacy = ["presidio-analyzer>=2.2,<3", "presidio-anonymizer>=2.2,<3",
           "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"]

[tool.setuptools.packages.find]
include = ["capstone*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
